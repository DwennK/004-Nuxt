name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NUXT_SESSION_PASSWORD: ci-only-session-password-with-at-least-32-characters

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.9

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          test "$(npm --version)" = "10.9.9"

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

  e2e:
    name: Browser smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.9

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        run: npm run test:e2e
