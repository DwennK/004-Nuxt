allowBuilds:
  "esbuild": true
  "fsevents": true
  "unrs-resolver": true
  "vue-demi": true
  "workerd": true
minimumReleaseAgeExclude:
  - '@iconify-json/lucide@1.2.140'
  - '@iconify-json/simple-icons@1.2.99'
overrides:
  # Patched releases while upstream dependencies still resolve vulnerable versions.
  'source-map-js@<1.2.2': 1.2.2
  'miniflare>sharp': 0.35.5
  'fontless>esbuild': 0.28.2
  'node-forge@>=1.4.0 <1.4.1': 1.4.1
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'serialize-javascript@>=7.0.0 <7.1.3': 7.1.3
  # Keep the decoder glue aligned with the WASM copied into public/vendor.
  'barcode-detector>zxing-wasm': 3.1.6
